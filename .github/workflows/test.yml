name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20, 22]

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}

      # The skill-description gate is Python. Pin it so the Node test that shells
      # out to it can never silently skip.
      - name: Use Python 3
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Skill description cap gate
        run: python3 scripts/check_skill_descriptions.py . --no-color --triggers

      - name: Run tests
        run: npm test
